# GitHub Actions CI for review_article_agent.
#
# Design: docs/implementation/kickoffs/16-mvp-hardening.md §3.
# Tests are POSIX-specific (Unix domain sockets, 0700 permissions, SIGKILL,
# detached worker), so every job runs on ubuntu-latest only. No secrets, no
# live-model jobs (logs are public). See docs/ci.md for the job map and the
# local equivalents.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Run the gated release checks (clean-venv install + scale)'
        type: boolean
        default: false
  schedule:
    # Nightly, off-peak (03:17 UTC).
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast tier: every PR, push, manual dispatch and nightly schedule.
  fast:
    name: fast (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # The wheel packaging test builds a wheel offline through the declared
      # build backend (pyproject.toml: requires = ["setuptools>=68"]). The
      # 3.14 runner ships no setuptools, so install it explicitly rather than
      # silently skipping the coverage.
      - name: Install build backend for the wheel packaging test
        run: python -m pip install "setuptools>=68" "pypdf==6.21.4"

      - name: Byte-compile src and scripts
        run: python -m compileall -q src scripts

      - name: Check contract docs
        run: python scripts/check_contract_docs.py

      - name: Run script tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Whitespace check (git diff --check)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            echo "git diff --check ${base} HEAD"
            git diff --check "${base}" HEAD
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "git diff --check HEAD~1 HEAD"
            git diff --check HEAD~1 HEAD
          else
            echo "no parent commit available; skipping git diff --check"
          fi

      # FAST_BUDGET_SECONDS: wall-clock budget for the fast tier. The fast
      # tier target is < 2 min on 4 CPUs (kickoff §4); the budget makes the
      # step fail when the suite regresses past it. It is passed straight
      # through as --budget to scripts/run_tests.py.
      - name: Fast test tier
        shell: bash
        env:
          FAST_BUDGET_SECONDS: '120'
        run: |
          args=(-j 4 --top 15 --timeout 1200)
          if [ -n "${FAST_BUDGET_SECONDS}" ]; then
            args+=(--budget "${FAST_BUDGET_SECONDS}")
          fi
          python scripts/run_tests.py "${args[@]}"

  # Full tier: PRs targeting main, nightly schedule and manual dispatch.
  # Not on push. 6 shards on 3.14 and 2 shards on 3.11, balanced by the
  # recorded per-module durations (tests/durations.json).
  full:
    name: full (py${{ matrix.python }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.14'
            shard: 0
            shards: 6
          - python: '3.14'
            shard: 1
            shards: 6
          - python: '3.14'
            shard: 2
            shards: 6
          - python: '3.14'
            shard: 3
            shards: 6
          - python: '3.14'
            shard: 4
            shards: 6
          - python: '3.14'
            shard: 5
            shards: 6
          - python: '3.11'
            shard: 0
            shards: 2
          - python: '3.11'
            shard: 1
            shards: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # The wheel packaging test builds a wheel offline through the declared
      # build backend (pyproject.toml: requires = ["setuptools>=68"]). The
      # 3.14 runner ships no setuptools, so install it explicitly rather than
      # silently skipping the coverage.
      - name: Install build backend for the wheel packaging test
        run: python -m pip install "setuptools>=68" "pypdf==6.21.4"

      - name: Run full test tier (shard ${{ matrix.shard }}/${{ matrix.shards }})
        shell: bash
        run: |
          python scripts/run_tests.py --slow -j 4 --top 10 --timeout 1800 \
            --durations-out "durations-${{ matrix.python }}-${{ matrix.shard }}.json" \
            $(python scripts/test_shards.py --shards ${{ matrix.shards }} --index ${{ matrix.shard }})

      - name: Upload shard durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-${{ matrix.python }}-${{ matrix.shard }}
          path: durations-${{ matrix.python }}-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: warn

  # Merge the 3.14 shard durations into one file so tests/durations.json can be
  # refreshed by hand from this artifact (see docs/ci.md).
  full-durations:
    name: full-durations
    needs: full
    if: ${{ always() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Download 3.14 shard durations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: durations-3.14-*
          merge-multiple: true

      - name: Merge shard durations
        shell: bash
        run: |
          ls -l
          python scripts/test_shards.py --merge durations-merged.json durations-3.14-*.json

      - name: Upload merged durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-merged
          path: durations-merged.json
          retention-days: 14
          if-no-files-found: warn

  # Gated release checks: manual dispatch with release=true, or a v* tag push.
  release:
    name: release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Clean-environment install check
        env:
          RAA_RELEASE_CHECK: '1'
        run: PYTHONPATH=src:tests python -m unittest tests.test_step15_release_check -v

      - name: Gated scale test (1k/10k candidates)
        env:
          RAA_SCALE_TESTS: '1'
        run: PYTHONPATH=src:tests python -m unittest tests.test_step15_scale -v
