[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-article-agent"
version = "0.0.0"
description = "AI-assisted, evidence-grounded scientific review writer (durable local project core)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
# Intentionally empty: the core is standard-library only. No agent framework.
# New external dependencies remain an implementation-facing, versioned detail.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
